# Analysis-wide settings. Used by later phases; a few are read during ingestion.

# Canonical analysis frequency for the monthly panel.
analysis_frequency: M

# CPI index base period, as published in Inflation.xlsx.
cpi_base_label: "index_2015_16=100"

# Deflation base year for real-vs-nominal price work (cleaning phase).
deflation_base_year: 2016

# Fiscal year convention for annual (crop) data: FY "2024-25" ends on this month/day.
fiscal_year_end: "06-30"

# --- placeholders for later phases (not used yet) ---
forecasting:
  horizon_months: 12
  backtest:
    scheme: rolling-origin
    min_train_months: 48
    step_months: 1
factors:
  max_lag_months: 12
events:
  min_segment_months: 6

# Horizontal YoY-inflation magnitude bands drawn on the dashboard's combined
# MoM/YoY chart. These are a common illustrative convention (roughly: an
# inflation-targeting "low" band, then moderate/high/very-high tiers) - NOT
# an official PBS/SBP classification. Edit freely; the chart reads this list,
# nothing is hard-coded in the chart code. `max: null` means "no upper bound".
inflation_bands:
  - label: "Deflation"
    min: null
    max: 0
  - label: "Low inflation"
    min: 0
    max: 3
  - label: "Moderate inflation"
    min: 3
    max: 7
  - label: "High inflation"
    min: 7
    max: 15
  - label: "Very high inflation"
    min: 15
    max: null
