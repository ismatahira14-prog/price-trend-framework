[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricelab"
version = "0.1.0"
description = "A Data-Driven Framework for Price Trend Analysis, Visualization, Forecasting, and Decision Support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isma Tahira" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    # --- added in the forecasting phase, kept here as a reminder ---
    # "statsmodels>=0.14",
    # "scikit-learn>=1.3",
    # "prophet>=1.1",
    # "shap>=0.44",
    # "ruptures>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "black>=24.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
# Local-only: talking to your SQL Server instance. Not needed on the deployed
# dashboard (that reads the committed DuckDB snapshot instead).
sqlserver = [
    "sqlalchemy>=2.0",
    "pyodbc>=5.0",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.22",
]

[project.scripts]
pricelab-ingest = "pricelab.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pricelab = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
